<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ICSRT Dashboard</title>
    <script>
        // Fix ResizeObserver error - suppress dev server overlay
        window.addEventListener('error', e => {
            if (e.message === 'ResizeObserver loop limit exceeded' || 
                e.message === 'ResizeObserver loop completed with undelivered notifications.') {
                const resizeObserverErrDiv = document.getElementById('webpack-dev-server-client-overlay-div');
                const resizeObserverErr = document.getElementById('webpack-dev-server-client-overlay');
                if (resizeObserverErr) {
                    resizeObserverErr.setAttribute('style', 'display: none');
                }
                if (resizeObserverErrDiv) {
                    resizeObserverErrDiv.setAttribute('style', 'display: none');
                }
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        });
        
        // Additional ResizeObserver error suppression
        const debounce = (func, wait) => {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        };
        
        // Suppress ResizeObserver errors completely
        window.addEventListener('error', debounce((e) => {
            if (e.message && e.message.includes('ResizeObserver')) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        }, 16));
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
