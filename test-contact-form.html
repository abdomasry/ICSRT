<!DOCTYPE html>
<html>
<head>
    <title>Contact Form Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .message { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .config-section { background: #f8f9fa; padding: 20px; margin: 20px 0; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>ICSRT Contact Form Test</h1>
    
    <div class="config-section">
        <h2>WhatsApp Configuration</h2>
        <div class="form-group">
            <label>Phone Number:</label>
            <input type="tel" id="whatsappPhone" placeholder="+1234567890">
        </div>
        <div class="form-group">
            <label>
                <input type="checkbox" id="whatsappEnabled" checked> Enable WhatsApp Notifications
            </label>
        </div>
        <button onclick="saveWhatsAppConfig()">Save WhatsApp Config</button>
        <button onclick="testWhatsAppConfig()">Test Config</button>
        <div id="configResult"></div>
    </div>
    
    <div>
        <h2>Test Contact Form</h2>
        <form id="contactForm">
            <div class="form-group">
                <label>Name:</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Subject:</label>
                <input type="text" id="subject" required>
            </div>
            <div class="form-group">
                <label>Category:</label>
                <select id="category">
                    <option value="general">General</option>
                    <option value="support">Support</option>
                    <option value="business">Business</option>
                    <option value="technical">Technical</option>
                </select>
            </div>
            <div class="form-group">
                <label>Message:</label>
                <textarea id="message" rows="5" required></textarea>
            </div>
            <button type="submit">Send Contact Request</button>
        </form>
        <div id="result"></div>
    </div>

    <div class="config-section">
        <h2>Contact Requests List</h2>
        <button onclick="fetchContactRequests()">Fetch Contact Requests</button>
        <div id="contactsList"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000/api';

        async function saveWhatsAppConfig() {
            const phone = document.getElementById('whatsappPhone').value;
            const enabled = document.getElementById('whatsappEnabled').checked;
            
            try {
                const response = await fetch(`${API_BASE}/whatsapp-config`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phoneNumber: phone, enabled })
                });
                
                const result = await response.json();
                document.getElementById('configResult').innerHTML = 
                    `<div class="message success">Config saved: ${JSON.stringify(result)}</div>`;
            } catch (error) {
                document.getElementById('configResult').innerHTML = 
                    `<div class="message error">Error: ${error.message}</div>`;
            }
        }

        async function testWhatsAppConfig() {
            try {
                const response = await fetch(`${API_BASE}/test-whatsapp`);
                const result = await response.json();
                document.getElementById('configResult').innerHTML = 
                    `<div class="message ${result.hasConfig ? 'success' : 'error'}">
                        ${JSON.stringify(result, null, 2)}
                    </div>`;
            } catch (error) {
                document.getElementById('configResult').innerHTML = 
                    `<div class="message error">Error: ${error.message}</div>`;
            }
        }

        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                subject: document.getElementById('subject').value,
                category: document.getElementById('category').value,
                message: document.getElementById('message').value,
                timestamp: new Date().toISOString()
            };
            
            try {
                const response = await fetch(`${API_BASE}/contact-requests`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                document.getElementById('result').innerHTML = 
                    `<div class="message success">Success: ${JSON.stringify(result)}</div>`;
                    
                document.getElementById('contactForm').reset();
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    `<div class="message error">Error: ${error.message}</div>`;
            }
        });

        async function fetchContactRequests() {
            try {
                const response = await fetch(`${API_BASE}/contact-requests`);
                const requests = await response.json();
                
                document.getElementById('contactsList').innerHTML = 
                    `<div class="message success">
                        <h3>Found ${requests.length} contact requests:</h3>
                        <pre>${JSON.stringify(requests, null, 2)}</pre>
                    </div>`;
            } catch (error) {
                document.getElementById('contactsList').innerHTML = 
                    `<div class="message error">Error: ${error.message}</div>`;
            }
        }

        // Load existing config on page load
        window.onload = async () => {
            try {
                const response = await fetch(`${API_BASE}/whatsapp-config`);
                const config = await response.json();
                if (config.phoneNumber) {
                    document.getElementById('whatsappPhone').value = config.phoneNumber;
                    document.getElementById('whatsappEnabled').checked = config.enabled;
                }
            } catch (error) {
                console.log('Could not load existing config:', error);
            }
        };
    </script>
</body>
</html>
